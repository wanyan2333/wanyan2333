# 每天让 Claude 读取你最近的 GitHub 动态，写一段「AI 日报」更新到 README
# 需要在仓库 Settings → Secrets and variables → Actions 里添加 ANTHROPIC_API_KEY
# 想改用 OpenAI：改加 OPENAI_API_KEY（Secret）和 OPENAI_MODEL（Variable，例如你账号可用的模型名）
name: AI Daily

on:
  schedule:
    - cron: "20 0 * * *"   # 每天 UTC 0:20（北京时间 8:20）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate AI daily note
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python .github/scripts/ai_daily.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git commit -m "chore: update AI daily note"; then
            git pull --rebase
            git push
          fi
