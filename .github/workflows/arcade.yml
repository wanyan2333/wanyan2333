# Turns the contribution graph into three animated games (Snake, Breakout, Bomberman)
# and publishes the SVGs to the `output` branch, once a day.
name: Arcade

on:
  schedule:
    - cron: "41 0 * * *"   # daily, 00:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Breakout + Bomberman
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "breakout,bomberman"
          hide_month_labels: "true"

      - name: List outputs
        run: ls -la dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
