# Regenerates the neofetch-style terminal card with live stats.
name: Profile card

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/neofetch_card.py"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/neofetch_card.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile card"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
